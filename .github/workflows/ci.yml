name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Release is what gets benchmarked; Debug keeps the internal assertions switched on.
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # QuickFIX takes a few minutes to build; rebuild only when its pin or patch changes.
      - name: Cache QuickFIX
        uses: actions/cache@v6
        with:
          path: build/_deps/quickfix-install
          key: quickfix-${{ runner.os }}-${{ hashFiles('scripts/build_quickfix.sh', 'third_party/quickfix/mingw.patch') }}

      - name: Build and test
        run: bash scripts/build.sh ${{ matrix.config }}
