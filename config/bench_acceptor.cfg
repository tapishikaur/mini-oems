# mini_oems settings for benchmarking: like acceptor.cfg, but with no
# FileStorePath (sequence numbers and sent messages are kept in memory) and no
# FileLogPath (messages aren't logged to disk). Compare the two to see what
# persistence and logging cost.

[DEFAULT]
ConnectionType=acceptor
SocketAcceptPort=9878
SocketReuseAddress=Y
SocketNodelay=Y
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
UseDataDictionary=Y
DataDictionary=${FIX44_XML}
ResetOnLogon=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=MINIOEMS
TargetCompID=CLIENT1
