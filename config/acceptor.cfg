# QuickFIX settings for the mini_oems gateway (a FIX 4.4 acceptor).
# ${FIX44_XML} is filled in by mini_oems with the pinned QuickFIX data dictionary.

[DEFAULT]
ConnectionType=acceptor
SocketAcceptPort=9878
SocketReuseAddress=Y
SocketNodelay=Y
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
UseDataDictionary=Y
DataDictionary=${FIX44_XML}
FileStorePath=store
FileLogPath=log
# Start every logon at sequence number 1, which keeps local demos simple.
# A production gateway keeps sequence numbers across logons for the whole
# trading day, so a client that reconnects can recover anything it missed.
ResetOnLogon=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=MINIOEMS
TargetCompID=CLIENT1

[SESSION]
BeginString=FIX.4.4
SenderCompID=MINIOEMS
TargetCompID=CLIENT2
