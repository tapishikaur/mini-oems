# QuickFIX settings for oems_load_client: a FIX 4.4 initiator that connects to
# mini_oems on this machine as CLIENT1. Messages are stored in memory and not logged.
# The client doesn't validate the gateway's messages (UseDataDictionary=N): the
# test suite already checks them, and the client shares the gateway's CPUs, so
# every microsecond it saves goes to the system being measured. The gateway
# still validates everything it receives.

[DEFAULT]
ConnectionType=initiator
SocketConnectHost=127.0.0.1
SocketConnectPort=9878
SocketNodelay=Y
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
ReconnectInterval=1
UseDataDictionary=N
ResetOnLogon=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=CLIENT1
TargetCompID=MINIOEMS
